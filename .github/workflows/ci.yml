name: StyleCircle CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: React tests and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install exact dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Verify production build
        run: npm run build

  backend:
    name: Express and MongoDB integration tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install exact dependencies
        run: npm ci
      - name: Run backend tests (including database integration)
        env:
          TEST_MONGO_URI: mongodb://127.0.0.1:27017/stylecircle_ci
        run: npm test

  dependency_audit:
    name: Dependency vulnerability inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit frontend dependencies
        working-directory: client
        run: |
          npm audit --json > audit.json || true
          node -e 'const r=require("./audit.json"); console.log("Frontend vulnerability counts:",JSON.stringify(r.metadata?.vulnerabilities||{})); console.log("HIGH/CRITICAL:", JSON.stringify(Object.entries(r.vulnerabilities||{}).filter(([n,v])=>["high","critical"].includes(v.severity)).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable}))))'
      - name: Audit backend dependencies
        working-directory: server
        run: |
          npm audit --json > audit.json || true
          node -e 'const r=require("./audit.json"); console.log("Backend vulnerability counts:",JSON.stringify(r.metadata?.vulnerabilities||{})); console.log("HIGH/CRITICAL:", JSON.stringify(Object.entries(r.vulnerabilities||{}).filter(([n,v])=>["high","critical"].includes(v.severity)).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable}))))'
